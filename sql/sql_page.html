<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Sales SQL</title>
<meta name="description" content="Ten SQLite queries on the UCI Online Retail dataset, with their outputs.">
<style>
  :root { --bg: #f6f6f4; --surface: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --line: #e4e3df; --code: #f0efec; --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111110; --surface: #1a1a19; --text: #f0efec; --muted: #c3c2b7; --line: #34332f; --code: #23231f; --accent: #3987e5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--accent); }
  h1 { margin: 0 0 6px; font-size: 1.8rem; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 10px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
  pre { background: var(--code); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: .82rem; margin: 0 0 12px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: .85rem; width: 100%; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <p><a href="./">← Dashboard</a></p>
  <h1>Ten SQL queries</h1>
  <p>SQLite, run on the cleaned data (4 tables: customers, products, orders, order_items). Joins, GROUP BY with HAVING, window functions (RANK, running total, LAG), second-highest value, CASE buckets and a LEFT JOIN. Outputs show up to 15 rows.</p>

</main>
</body>
</html>
